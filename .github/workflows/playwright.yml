name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      continue-on-error: true

    - name: Upload Allure results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-shardIndex-${{ matrix.shardIndex }}
        path: allure-results
        retention-days: 1  

    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1    


  merge-allure-report:
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 20
    
    - name: Install dependencies
      run: npm ci

    - name: Install Allure CLI
      run: npm install -g allure-commandline

    - name: Download all allure-results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
    
    - name: Merge Allure results
      run: |
        mkdir merged-results
        find allure-results -type f -exec cp {} merged-results \;
   
    - name: Generate Final Allure report
      run: allure generate merge-results --clean -o allure-report
    
    - name: Upload Final Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-final
        path: allure-report/
        retention-days: 30

    - name: Upload combined Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30